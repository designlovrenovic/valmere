<button class="icon-btn" type="button" aria-label="Account"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="6.4" r="3.7"></circle><path d="M2.8 18.6c.9-3.7 3.7-5.8 7.2-5.8s6.3 2.1 7.2 5.8"></path></svg></button>

</header>

<p class="eyebrow">New pieces</p>
<h2 class="sec-title">Latest From the Workshop</h2>
</div>
<div class="n-art" ref="{{h.setNArt}}">

<sc-if value="{{o.icGear}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3"></circle><circle cx="10" cy="10" r="6.4" stroke-dasharray="2 1.6"></circle></svg></sc-if>
</span>
<span class="t-label">{{o.label}}</span>
</button>
</div>
</sc-for>
</div>
<div class="t-cta">
<button class="t-cta-btn" type="button">Commission this watch<svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 5h13M10.5 1.5L14 5l-3.5 3.5"></path></svg></button>
<p class="t-sum" aria-live="polite">{{tSummary}}</p>
<p class="t-lead">Built to your order · Ready in about [14 weeks]</p>
<p class="t-note" aria-live="polite">{{tNote}}</p>
</div>
<div class="t-mobile">
<div class="t-chips"><sc-for list="{{tParts}}" as="p" hint-placeholder-count="3"><button class="t-chip {{p.cls}}" type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for></div>
<div class="t-chips"><sc-for list="{{tOpts}}" as="o" hint-placeholder-count="4"><button class="t-chip {{o.cls}}" type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}"><span class="t-chipdot" style="background: {{o.color}}"></span>{{o.label}}</button></sc-for></div>
</div>
</div>
</section>

<section class="sec s-craft drag-zone {{kCls}}" ref="{{h.setKSec}}" aria-label="Our process" onPointerEnter="{{h.k.enter}}" onPointerMove="{{h.k.move}}" onPointerLeave="{{h.k.leave}}" onPointerDown="{{h.k.down}}" onPointerUp="{{h.k.up}}" onPointerCancel="{{h.k.up}}">
<div class="stage craft-stage" style="zoom: {{z}}">
<div class="k-left">
<p class="eyebrow">How it’s made</p>
<h2 class="k-title">From Sketch<br>to Your<br>Wrist</h2>
<p class="k-copy">Every Sillage goes through the same five stages before it leaves the workshop, and each one carries a [5]-year warranty. Drag the wheel to follow them.</p>
</div>
<div class="k-art">
<div class="k-art-in" ref="{{h.setKArt}}">
<svg class="k-svg" viewBox="0 0 1440 934" aria-hidden="true">
<circle cx="950" cy="1551" r="832" fill="none" stroke="#203248" stroke-opacity="0.12" stroke-width="1"></circle>
<path d="M950,719 L950,934" stroke="#203248" stroke-opacity="0.1" stroke-width="1"></path>
<g class="k-wheel" style="transform: rotate({{kWheel}}deg)">
<circle cx="950" cy="1551" r="832" fill="none" stroke="#203248" stroke-opacity="0.38" stroke-width="16" stroke-dasharray="1.2 236.4186" stroke-dashoffset="0.6" transform="rotate(-90 950 1551)"></circle>
<g style="transform: rotate({{kProgRot}}deg); transform-origin: 950px 1551px">
<path class="k-prog" d="M950,719 A832,832 0 0 1 1184.4,752.7" pathLength="100" ref="{{h.setKProg}}" style="stroke-dashoffset: {{kProgOff}}; animation-name: {{kProgAnim}}; animation-duration: {{kProgDur}}; animation-delay: {{kProgDelay}}; animation-play-state: {{kProgPlay}}" onAnimationEnd="{{h.progDone}}"></path>
</g>
</g>
<circle class="k-pulse {{kPulseCls}}" cx="950" cy="719" r="6"></circle>
<circle cx="950" cy="719" r="3.6" fill="#203248"></circle>
</svg>
<div class="k-nums" style="transform: rotate({{kWheel}}deg)" aria-hidden="true">
<div class="k-numw" style="transform: rotate({{n0.rot}}deg)"><span class="k-num" style="bottom: {{n0.bt}}px; font-size: {{n0.fs}}px; font-weight: {{n0.fw}}; opacity: {{n0.op}}">{{n0.label}}</span></div>
<div class="k-numw" style="transform: rotate({{n1.rot}}deg)"><span class="k-num" style="bottom: {{n1.bt}}px; font-size: {{n1.fs}}px; font-weight: {{n1.fw}}; opacity: {{n1.op}}">{{n1.label}}</span></div>
<div class="k-numw" style="transform: rotate({{n2.rot}}deg)"><span class="k-num" style="bottom: {{n2.bt}}px; font-size: {{n2.fs}}px; font-weight: {{n2.fw}}; opacity: {{n2.op}}">{{n2.label}}</span></div>
<div class="k-numw" style="transform: rotate({{n3.rot}}deg)"><span class="k-num" style="bottom: {{n3.bt}}px; font-size: {{n3.fs}}px; font-weight: {{n3.fw}}; opacity: {{n3.op}}">{{n3.label}}</span></div>
<div class="k-numw" style="transform: rotate({{n4.rot}}deg)"><span class="k-num" style="bottom: {{n4.bt}}px; font-size: {{n4.fs}}px; font-weight: {{n4.fw}}; opacity: {{n4.op}}">{{n4.label}}</span></div>
<div class="k-numw" style="transform: rotate({{n5.rot}}deg)"><span class="k-num" style="bottom: {{n5.bt}}px; font-size: {{n5.fs}}px; font-weight: {{n5.fw}}; opacity: {{n5.op}}">{{n5.label}}</span></div>
<div class="k-numw" style="transform: rotate({{n6.rot}}deg)"><span class="k-num" style="bottom: {{n6.bt}}px; font-size: {{n6.fs}}px; font-weight: {{n6.fw}}; opacity: {{n6.op}}">{{n6.label}}</span></div>
</div>
<sc-for list="{{kSlides}}" as="s" hint-placeholder-count="5">
<div class="k-slide {{s.cls}}" style="transform: {{s.tf}}; opacity: {{s.vis}}" aria-hidden="{{s.hidden}}">
<div class="k-card">
<div class="k-img"><img src="{{s.img}}" alt="{{s.alt}}" draggable="false" style="filter: blur({{s.blur}}px); transform: scale({{s.zoom}})"><div class="k-veil" style="opacity: {{s.veil}}"></div></div>
<div class="k-text" style="opacity: {{s.txt}}">
<h3 class="k-h">{{s.title}}</h3>
<p class="k-p">{{s.text}}</p>
</div>
</div>
</div>
</sc-for>
<div class="cursor cursor-dark {{kCur.cls}}" style="transform: translate({{kCur.x}}px, {{kCur.y}}px) scale({{kCur.s}})" aria-hidden="true"><svg width="24" height="10" viewBox="0 0 24 10" fill="currentColor"><path d="M4.5 4.25h15v1.5h-15z"></path><path d="M0 5l5.6-4.2v8.4z"></path><path d="M24 5l-5.6 4.2V.8z"></path></svg></div>
</div>
</div>
<button class="sr" type="button" onClick="{{h.kPrev}}">Previous step</button>
<button class="sr" type="button" onClick="{{h.kNext}}">Next step</button>
</div>
</section>

<section class="sec s-jour" aria-label="Our journal">
<div class="stage jour-stage" style="zoom: {{z}}">
<div class="head">
<p class="eyebrow">Journal</p>
<h2 class="sec-title">Notes From the Bench</h2>
</div>
<a class="jx-all" href="#">All articles<svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 5h13M10.5 1.5L14 5l-3.5 3.5"></path></svg></a>
<div class="jx-acc">
<sc-for list="{{jPanels}}" as="p" hint-placeholder-count="6">
<div class="jx-pan {{p.cls}}" onMouseEnter="{{p.open}}">
<button class="jx-tab" type="button" aria-expanded="{{p.isOpen}}" aria-label="{{p.aria}}" onClick="{{p.open}}" onFocus="{{p.open}}">
<span class="jx-num">{{p.num}}</span>
<span class="jx-vl">{{p.label}}</span>
<span class="jx-plus"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9"></path></svg></span>
</button>
<div class="jx-body" aria-hidden="{{p.hidden}}">
<div class="jx-img"><img src="{{p.img}}" alt="{{p.alt}}" draggable="false"></div>
<div class="jx-txt">
<p class="jx-meta">{{p.num}}<i></i>{{p.cat}}</p>
<h3 class="jx-h">{{p.title}}</h3>
<p class="jx-p">{{p.text}}</p>
<a class="jx-cta" href="#"><span><svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 5h11M8.5 1.5L12 5 8.5 8.5"></path></svg></span>Read the article</a>
</div>
<span class="jx-ghost" aria-hidden="true">{{p.num}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</section>

<footer class="sec s-foot">
<div class="stage foot-stage" style="zoom: {{z}}">
<p class="fx-state"><em>Built by one pair of hands.</em> Each Sillage is made by a single watchmaker, start to finish. Come and see one being made.</p>
<div class="fx-news">
<p class="eyebrow">Private list</p>
<p class="fx-np">We write when a new piece leaves the workshop, and only then. Members see it before it appears on the site.</p>
<sc-if value="{{fShowForm}}" hint-placeholder-val="{{true}}">
<form class="fx-form" onSubmit="{{h.fSubmit}}">
<label class="sr" for="fx-email">Email address</label>
<input class="fx-input" id="fx-email" type="email" name="email" placeholder="Your email address" required="">
<button class="fx-sub" type="submit">Join the list<svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 5h13M10.5 1.5L14 5l-3.5 3.5"></path></svg></button>
</form>
</sc-if>
<sc-if value="{{fDone}}" hint-placeholder-val="{{false}}">
<p class="fx-thanks" role="status"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 7.5l5 5 10-11"></path></svg>Thank you. We'll write when the next piece is finished.</p>
</sc-if>
</div>
<div class="fx-rule" style="top: 300px"></div>
<div class="fx-col" style="left: 108px">
<a class="f-logo" href="#" aria-label="Maison Valmère home"><svg class="logo-mark" width="38" height="38" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="19" stroke="currentColor" stroke-width="1.1"></circle><circle cx="20" cy="20" r="16.5" stroke="currentColor" stroke-width="0.5" opacity="0.5"></circle><path d="M19.4 5H20.6V7.7H19.4Z" fill="currentColor"></path><path class="lm-v lm-l" d="M21.38 26.62L13.41 9.99L12.90 10.20L12.39 10.41L18.62 27.78Z" fill="currentColor"></path><path class="lm-v lm-r" d="M20.42 27.37L27.35 10.31L27.10 10.20L26.85 10.09L19.58 27.03Z" fill="currentColor"></path><circle cx="20" cy="27.2" r="1.9" fill="currentColor"></circle><circle class="lm-hour" cx="20" cy="33.4" r="0.8" fill="currentColor" opacity="0.85"></circle></svg><span class="logo-word">Valmère</span></a>
<div class="fx-social">
<a href="#">Instagram</a>
<a href="#">Pinterest</a>
<a href="#">YouTube</a>
</div>
</div>
<div class="fx-col" style="left: 520px">
<p class="fx-h">Shop</p>
<ul class="fx-list">
<li><a href="#">New arrivals</a></li>
<li><a href="#">The collection</a></li>
<li><a href="#">Commission a watch</a></li>
<li><a href="#">Journal</a></li>
</ul>
</div>
<div class="fx-col" style="left: 760px">
<p class="fx-h">Client care</p>
<ul class="fx-list">
<li><a href="#">Book a private viewing</a></li>
<li><a href="#">Shipping &amp; returns</a></li>
<li><a href="#">Warranty &amp; service</a></li>
<li><a href="#">Contact us</a></li>
</ul>
</div>
<div class="fx-col" style="left: 1040px">
<p class="fx-h">Visit</p>
<ul class="fx-list">
<li class="fx-ph">[BOUTIQUE ADDRESS]</li>
<li class="fx-ph">[CITY, POSTCODE]</li>
<li class="fx-ph">[OPENING HOURS]</li>
<li class="fx-ph">[PHONE]</li>
</ul>
</div>
<div class="fx-rule" style="top: 520px"></div>
<p class="fx-copy">© 2026 Maison Valmère. All rights reserved.</p>
<ul class="fx-legal">
<li><a href="#">Privacy</a></li>
<li><a href="#">Terms</a></li>
<li><a href="#">Cookies</a></li>
</ul>
<a class="fx-top" href="#lt-top" aria-label="Back to top"><svg width="10" height="14" viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13V1.5M1.5 5L5 1.5 8.5 5"></path></svg></a>
</div>
</footer>

</div>
</template>

<script src="js/dc-runtime.js"></script>
<script src="js/app.js"></script>
</body>
